<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Gestione medici</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Medical Center Sanitas</h1>

        <h2>Medici</h2>

        <button onclick="window.location.href='index.html'">
            Torna alla Dashboard
        </button>

        <div class="card">

            <h3>Aggiungi medico</h3>

            <input type="text" id="nome" placeholder="Nome">
            <input type="text" id="cognome" placeholder="Cognome">
            <input type="text" id="specializzazione" placeholder="Specializzazione">

            <button onclick="aggiungiMedico()">Aggiungi</button>
        </div>

        <div class="card">
            <h2>Lista medici</h2>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cognome</th>
                        <th>Specializzazione</th>
                        <th>Azione</th>
                    </tr>
                </thead>
                <tbody id="corpoMedici"></tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>

</body>

</html>
